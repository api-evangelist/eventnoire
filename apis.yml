aid: eventnoire
name: Eventnoire
description: Eventnoire is an event discovery and ticketing platform centered on Black
  culture, helping attendees find and buy tickets to concerts, festivals, parties,
  and community events while giving organizers tools to create and manage events,
  sell tickets, and grow their audiences. A Techstars-backed company, Eventnoire runs
  consumer discovery at eventnoire.com alongside an organizer/partner portal and a
  culture-focused blog. It currently exposes no public developer API, so this profile
  captures the company's public web surface (blog, legal, organizer sign-up, attendee
  login, support) and its domain security posture.
